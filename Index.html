index.html
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c32">
  <title>TerraScan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f4f1;
      color: #1d2a24;
    }
    header {
      background: #183c32;
      color: white;
      padding: 24px 18px;
    }
    header h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; color: #d1e3d7; }
    main { max-width: 720px; margin: auto; padding: 16px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #0000000d;
    }
    h2 { font-size: 19px; margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input, button {
      width: 100%;
      min-height: 46px;
      border-radius: 9px;
      font: inherit;
    }
    input {
      border: 1px solid #b9c8be;
      padding: 10px;
      background: white;
    }
    button {
      border: 0;
      padding: 12px;
      background: #226b4c;
      color: white;
      font-weight: 600;
      margin-top: 12px;
    }
    button.secondary { background: #e1ebe4; color: #183c32; }
    .status {
      padding: 12px;
      background: #edf5ef;
      border-radius: 9px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .number { font-size: 28px; font-weight: 700; }
    .small { color: #5a6a60; font-size: 13px; line-height: 1.5; }
    .point {
      padding: 12px 0;
      border-bottom: 1px solid #e5ebe6;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>TerraScan</h1>
    <p>Terreinmeting · Hoogtes · Grondwerk</p>
  </header>
